name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/ew-backend
          git pull origin main
          
          docker build -t ew-backend .
          docker stop ew-backend || true
          docker rm ew-backend || true
          docker run -d --name ew-backend --network host --restart unless-stopped --env-file .env ew-backend
